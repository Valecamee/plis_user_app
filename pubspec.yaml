name: plis_user
description: "Aplicación de usuario para la plataforma de transporte Plis"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Design
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.9
  # Firebase - Versiones más estables
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.9
  firebase_app_check: ^0.2.2+7
  
  # File handling (para cédula y foto)
  file_picker: ^8.0.0+1
  
  # Permissions
  permission_handler: ^11.2.0
  
  # Environment variables
  flutter_dotenv: ^5.1.0
  
  # Path handling
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"



flutter:
  uses-material-design: true

  assets:
    - assets/images/plis-logo.svg
    - assets/images/crearViaje4.jpg
    - assets/icons/bell.png
    - assets/icons/device-mobile.png
    - assets/icons/map-pin.png
    - assets/icons/icon.png

  
  assets:
    - assets/images/
    - assets/icons/

  # fonts:
  #   - family: Manrope
  #     fonts:
  #       - asset: assets/fonts/Manrope-Regular.ttf
  #       - asset: assets/fonts/Manrope-Bold.ttf
  #         weight: 700